; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:m5stick-c]
platform = espressif32
board = m5stick-c
framework = arduino
monitor_speed = 115200
lib_ldf_mode = deep+
lib_deps =
  m5stack/M5StickCPlus2
; DFRobot_GP8XXX's analogWriteResolution() call doesn't match the installed
; Arduino-ESP32 core's signature and fails to build if pulled in (see the
; other environments below for the same fix).
lib_ignore =
    DFRobot_GP8XXX
upload_port = COM*

; On-device inference firmware for the best-performing early-fusion CNN. Kept as a
; separate environment/source folder from [env:m5stick-c] so the existing data-collection
; firmware in src/ is never touched -- flash either environment independently.
[env:m5stick-c-inference]
platform = espressif32
board = m5stick-c
framework = arduino
monitor_speed = 115200
lib_ldf_mode = deep+
build_src_filter =
  -<*>
  +<../src_inference/*>
lib_deps =
  m5stack/M5StickCPlus2
  tanakamasayuki/TensorFlowLite_ESP32
  kosme/arduinoFFT
; DFRobot_GP8XXniX above is a typo that doesn't match the real library name
; (DFRobot_GP8XXX) and so ignores nothing; that library's analogWriteResolution() call
; doesn't match the installed Arduino-ESP32 core's signature and fails to build once
; TensorFlowLite_ESP32 pulls enough of the dependency graph to actually compile it.
lib_ignore =
    DFRobot_GP8XXX
upload_port = COM*

; Embedding-level (late) fusion: independent IMU + audio backbones (frozen) with a small
; trained head on their concatenated embeddings. Second-best fusion strategy from this
; session's comparison (~91.7% on the shrunk backbones). Own source folder/environment,
; same isolation reasoning as m5stick-c-inference.
[env:m5stick-c-embedding-fusion]
platform = espressif32
board = m5stick-c
framework = arduino
monitor_speed = 115200
lib_ldf_mode = deep+
build_src_filter =
  -<*>
  +<../src_inference_embedding_fusion/*>
lib_deps =
  m5stack/M5StickCPlus2
  tanakamasayuki/TensorFlowLite_ESP32
  kosme/arduinoFFT
lib_ignore =
    DFRobot_GP8XXX
upload_port = COM*

; Decision-level fusion: same two backbones as m5stick-c-embedding-fusion, combined via a
; grid-searched weighted average of their softmax outputs instead of a trained head
; (~89.9% on the shrunk backbones).
[env:m5stick-c-decision-fusion]
platform = espressif32
board = m5stick-c
framework = arduino
monitor_speed = 115200
lib_ldf_mode = deep+
build_src_filter =
  -<*>
  +<../src_inference_decision_fusion/*>
lib_deps =
  m5stack/M5StickCPlus2
  tanakamasayuki/TensorFlowLite_ESP32
  kosme/arduinoFFT
lib_ignore =
    DFRobot_GP8XXX
upload_port = COM*
